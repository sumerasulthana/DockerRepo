<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>feastly · food ordering</title>
  <!-- fonts & icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #fff9f5 0%, #fff1e8 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    /* main card */
    .order-app {
      max-width: 1200px;
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 42px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08), 0 10px 30px rgba(0, 0, 0, 0.05), inset 0 1px 2px rgba(255, 255, 255, 0.7);
      padding: 32px 36px 36px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.2s;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
      flex-wrap: wrap;
      gap: 18px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      background: #ff7043;
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 20px -8px rgba(255, 112, 67, 0.4);
    }

    .logo-icon i {
      font-size: 30px;
      color: white;
    }

    .logo-text h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #2e241f;
    }

    .logo-text span {
      font-size: 14px;
      font-weight: 500;
      color: #b28b7a;
      letter-spacing: 0.3px;
    }

    .cart-badge {
      background: white;
      padding: 12px 22px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.04);
      border: 1px solid #f0e1d8;
      transition: all 0.2s;
      cursor: default;
    }

    .cart-badge i {
      font-size: 20px;
      color: #ff7043;
    }

    .cart-count {
      background: #ff7043;
      color: white;
      font-weight: 700;
      font-size: 16px;
      width: 28px;
      height: 28px;
      border-radius: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .cart-total {
      font-weight: 700;
      font-size: 18px;
      color: #2e241f;
      margin-left: 4px;
    }

    /* search & filter row */
    .search-filter {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 18px;
    }

    .search-wrapper {
      display: flex;
      align-items: center;
      background: white;
      padding: 8px 20px;
      border-radius: 60px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.02);
      border: 1px solid #f0e1d8;
      flex: 1 1 280px;
      transition: all 0.2s;
    }

    .search-wrapper:focus-within {
      border-color: #ffb59b;
      box-shadow: 0 8px 22px rgba(255, 112, 67, 0.12);
    }

    .search-wrapper i {
      color: #b28b7a;
      font-size: 18px;
      margin-right: 12px;
    }

    .search-wrapper input {
      border: none;
      outline: none;
      font-size: 15px;
      font-weight: 500;
      background: transparent;
      width: 100%;
      color: #2e241f;
    }

    .search-wrapper input::placeholder {
      color: #cbb2a8;
      font-weight: 400;
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: transparent;
      border: none;
      padding: 10px 20px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 15px;
      color: #7f6a5e;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .cat-btn i {
      margin-right: 6px;
      font-size: 14px;
    }

    .cat-btn:hover {
      background: #fff1e8;
      color: #ff7043;
    }

    .cat-btn.active {
      background: #ff7043;
      color: white;
      box-shadow: 0 10px 18px -8px rgba(255, 112, 67, 0.4);
    }

    /* menu grid */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 24px;
      margin-bottom: 24px;
    }

    /* food card */
    .food-card {
      background: white;
      border-radius: 28px;
      padding: 20px 18px 18px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.04);
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
      border: 1px solid #f7ede8;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeInUp 0.4s forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .food-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 30px 40px -14px rgba(255, 112, 67, 0.18);
      border-color: #ffd9cc;
    }

    .card-img {
      font-size: 56px;
      text-align: center;
      margin-bottom: 14px;
      line-height: 1;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.06));
    }

    .food-name {
      font-weight: 700;
      font-size: 19px;
      color: #2e241f;
      margin-bottom: 4px;
      letter-spacing: -0.2px;
    }

    .food-desc {
      font-size: 13px;
      color: #b28b7a;
      font-weight: 500;
      margin-bottom: 12px;
      line-height: 1.4;
      flex: 1;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }

    .price {
      font-weight: 700;
      font-size: 20px;
      color: #ff7043;
    }

    .price small {
      font-size: 13px;
      font-weight: 500;
      color: #b28b7a;
      margin-left: 2px;
    }

    .add-btn {
      background: #ff7043;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 10px 16px -6px rgba(255, 112, 67, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .add-btn:hover {
      background: #e55a2e;
      transform: scale(1.05);
      box-shadow: 0 14px 22px -6px rgba(255, 112, 67, 0.5);
    }

    .add-btn:active {
      transform: scale(0.95);
    }

    /* empty state */
    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #b28b7a;
      font-weight: 500;
      background: #fffbf9;
      border-radius: 32px;
      border: 1px dashed #f0d9cf;
    }

    .empty-message i {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    /* footer / order summary */
    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 16px;
      padding-top: 24px;
      border-top: 2px dashed #f0e1d8;
    }

    .items-count {
      font-weight: 600;
      color: #7f6a5e;
      font-size: 16px;
      background: #fff2ec;
      padding: 8px 18px;
      border-radius: 40px;
    }

    .items-count i {
      color: #ff7043;
      margin-right: 8px;
    }

    .checkout-btn {
      background: #2e241f;
      color: white;
      border: none;
      padding: 16px 42px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 16px 30px -8px rgba(46, 36, 31, 0.25);
    }

    .checkout-btn:hover {
      background: #1f1814;
      transform: scale(1.02);
      box-shadow: 0 20px 34px -8px rgba(46, 36, 31, 0.35);
    }

    .checkout-btn i {
      font-size: 18px;
    }

    /* toast notification */
    .toast-message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #2e241f;
      color: white;
      padding: 14px 32px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast-message.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-message i {
      color: #ffb59b;
      margin-right: 10px;
    }

    /* responsive */
    @media (max-width: 650px) {
      .order-app {
        padding: 22px 18px 28px;
        border-radius: 32px;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .cart-badge {
        align-self: flex-end;
      }
      .menu-grid {
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .food-card {
        padding: 16px 14px;
      }
      .food-name {
        font-size: 16px;
      }
      .price {
        font-size: 17px;
      }
      .add-btn {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }
      .checkout-btn {
        padding: 14px 28px;
        font-size: 16px;
      }
    }

    @media (max-width: 450px) {
      .menu-grid {
        grid-template-columns: 1fr;
      }
      .search-filter {
        flex-direction: column;
        align-items: stretch;
      }
      .categories {
        justify-content: center;
      }
      .order-footer {
        flex-direction: column;
        align-items: stretch;
      }
      .checkout-btn {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="order-app">
    <!-- header -->
    <div class="header">
      <div class="logo-area">
        <div class="logo-icon">
          <i class="fas fa-utensils"></i>
        </div>
        <div class="logo-text">
          <h1>feastly</h1>
          <span>order · enjoy · repeat</span>
        </div>
      </div>
      <div class="cart-badge">
        <i class="fas fa-shopping-bag"></i>
        <span class="cart-count" id="cartCount">0</span>
        <span class="cart-total" id="cartTotal">$0</span>
      </div>
    </div>

    <!-- search + category -->
    <div class="search-filter">
      <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search for dishes...">
      </div>
      <div class="categories" id="categoryContainer">
        <button class="cat-btn active" data-category="all"><i class="fas fa-border-all"></i>All</button>
        <button class="cat-btn" data-category="pizza"><i class="fas fa-pizza-slice"></i>Pizza</button>
        <button class="cat-btn" data-category="burger"><i class="fas fa-hamburger"></i>Burger</button>
        <button class="cat-btn" data-category="sushi"><i class="fas fa-fish"></i>Sushi</button>
        <button class="cat-btn" data-category="dessert"><i class="fas fa-ice-cream"></i>Dessert</button>
      </div>
    </div>

    <!-- menu grid -->
    <div class="menu-grid" id="menuGrid"></div>

    <!-- footer -->
    <div class="order-footer">
      <div class="items-count" id="itemsCount">
        <i class="fas fa-receipt"></i> <span id="itemsCountNumber">0</span> items in cart
      </div>
      <button class="checkout-btn" id="checkoutBtn">
        <i class="fas fa-arrow-right"></i> Checkout
      </button>
    </div>
  </div>

  <!-- toast message -->
  <div class="toast-message" id="toast">
    <i class="fas fa-check-circle"></i> <span id="toastText">Item added to cart</span>
  </div>

  <script>
    (function() {
      // ---------- DATA ----------
      const foodItems = [
        { id: 1, name: 'Margherita Pizza', desc: 'Fresh basil, mozzarella, tomato', price: 12.90, emoji: '🍕', category: 'pizza' },
        { id: 2, name: 'Pepperoni Pizza', desc: 'Spicy pepperoni, double cheese', price: 14.50, emoji: '🍕', category: 'pizza' },
        { id: 3, name: 'Cheeseburger', desc: 'Angus beef, cheddar, pickles', price: 10.90, emoji: '🍔', category: 'burger' },
        { id: 4, name: 'BBQ Bacon Burger', desc: 'Smoky BBQ, crispy bacon, onion', price: 13.20, emoji: '🍔', category: 'burger' },
        { id: 5, name: 'Salmon Nigiri', desc: 'Fresh salmon, sushi rice', price: 8.50, emoji: '🍣', category: 'sushi' },
        { id: 6, name: 'California Roll', desc: 'Crab, avocado, cucumber, roe', price: 11.30, emoji: '🍣', category: 'sushi' },
        { id: 7, name: 'Chocolate Lava', desc: 'Warm molten chocolate cake', price: 7.90, emoji: '🍫', category: 'dessert' },
        { id: 8, name: 'Berry Cheesecake', desc: 'Creamy cheesecake, fresh berries', price: 8.90, emoji: '🍰', category: 'dessert' },
      ];

      // ---------- STATE ----------
      let cart = [];               // { id, name, price, emoji, quantity }
      let activeCategory = 'all';
      let searchQuery = '';

      // DOM elements
      const menuGrid = document.getElementById('menuGrid');
      const cartCountEl = document.getElementById('cartCount');
      const cartTotalEl = document.getElementById('cartTotal');
      const itemsCountNumberEl = document.getElementById('itemsCountNumber');
      const searchInput = document.getElementById('searchInput');
      const categoryContainer = document.getElementById('categoryContainer');
      const checkoutBtn = document.getElementById('checkoutBtn');
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');

      // Toast timer
      let toastTimer = null;

      // ---------- RENDER MENU ----------
      function renderMenu() {
        // Filter by category and search
        const filtered = foodItems.filter(item => {
          const matchesCategory = activeCategory === 'all' || item.category === activeCategory;
          const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                item.desc.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });

        if (filtered.length === 0) {
          menuGrid.innerHTML = `
            <div class="empty-message">
              <i class="fas fa-utensils"></i>
              <h3 style="font-weight: 600; margin-bottom: 8px;">No dishes found</h3>
              <p style="font-size: 15px;">Try a different search or category</p>
            </div>
          `;
          return;
        }

        // Build cards
        let html = '';
        filtered.forEach((item, idx) => {
          // find if item in cart to show quantity indicator (optional)
          const cartItem = cart.find(ci => ci.id === item.id);
          const quantityBadge = cartItem ? `<span style="font-size: 12px; background: #ff7043; color: white; padding: 2px 8px; border-radius: 40px; margin-left: 8px;">${cartItem.quantity}</span>` : '';

          html += `
            <div class="food-card" style="animation-delay: ${idx * 0.04}s">
              <div class="card-img">${item.emoji}</div>
              <div class="food-name">${item.name} ${quantityBadge}</div>
              <div class="food-desc">${item.desc}</div>
              <div class="price-row">
                <div class="price">$${item.price.toFixed(2)}<small></small></div>
                <button class="add-btn" data-id="${item.id}" title="Add to cart">
                  <i class="fas fa-plus"></i>
                </button>
              </div>
            </div>
          `;
        });

        menuGrid.innerHTML = html;

        // Attach event listeners to add buttons
        document.querySelectorAll('.add-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = Number(btn.dataset.id);
            addToCart(id);
          });
        });
      }

      // ---------- ADD TO CART ----------
      function addToCart(id) {
        const item = foodItems.find(f => f.id === id);
        if (!item) return;

        const existing = cart.find(ci => ci.id === id);
        if (existing) {
          existing.quantity += 1;
        } else {
          cart.push({
            id: item.id,
            name: item.name,
            price: item.price,
            emoji: item.emoji,
            quantity: 1
          });
        }

        updateCartUI();
        showToast(`${item.name} added to cart`);
        renderMenu();  // re-render to show quantity badge
      }

      // ---------- UPDATE CART UI ----------
      function updateCartUI() {
        const totalItems = cart.reduce((sum, ci) => sum + ci.quantity, 0);
        const totalPrice = cart.reduce((sum, ci) => sum + (ci.price * ci.quantity), 0);

        cartCountEl.textContent = totalItems;
        cartTotalEl.textContent = `$${totalPrice.toFixed(2)}`;
        itemsCountNumberEl.textContent = totalItems;

        // little animation on cart badge
        cartCountEl.style.transform = 'scale(1.2)';
        setTimeout(() => cartCountEl.style.transform = 'scale(1)', 150);
      }

      // ---------- TOAST ----------
      function showToast(message) {
        toastText.textContent = message;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 2200);
      }

      // ---------- CHECKOUT ----------
      function handleCheckout() {
        if (cart.length === 0) {
          showToast('Your cart is empty');
          return;
        }
        const total = cart.reduce((sum, ci) => sum + (ci.price * ci.quantity), 0);
        const itemCount = cart.reduce((sum, ci) => sum + ci.quantity, 0);
        showToast(`✅ Order placed · ${itemCount} items · $${total.toFixed(2)}`);
        // reset cart
        cart = [];
        updateCartUI();
        renderMenu();
      }

      // ---------- EVENT LISTENERS ----------
      // Search
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        renderMenu();
      });

      // Category filter
      categoryContainer.addEventListener('click', (e) => {
        const btn = e.target.closest('.cat-btn');
        if (!btn) return;
        const category = btn.dataset.category;

        // update active class
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        activeCategory = category;
        renderMenu();
      });

      // Checkout
      checkoutBtn.addEventListener('click', handleCheckout);

      // ---------- INIT ----------
      function init() {
        renderMenu();
        updateCartUI();
      }

      init();

      // Expose addToCart for any external use (optional)
      window.addToCart = addToCart;
    })();
  </script>
</body>
</html>
